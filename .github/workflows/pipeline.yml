name: Content pipeline

on:
  schedule:
    - cron: "0 2 * * 0" # 02:00 UTC every Sunday: check tours, describe tours, refresh published pages that are due
  workflow_dispatch:
    inputs:
      max:
        description: "Most rows to refresh and publish"
        default: "30"

permissions:
  contents: read

# Never let two runs move the same Queue rows at once.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # More than 20 drafts go through the Message Batches API, which can take a
    # while to finish; the job waits for it.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Links the owner pasted into Tours_Inbox: import them, fill them in (GetYourGuide
      # and Viator APIs; Winalist pages when WINALIST_READ_PAGES=1), publish those that
      # meet the selection rules, write their notes and queue ranked lists.
      - run: npm run pipeline -- tours:import --max 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GYG_API_KEY: ${{ secrets.GYG_API_KEY }}
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
          WINALIST_READ_PAGES: ${{ vars.WINALIST_READ_PAGES }}
          PIPELINE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_EMAIL }}
          PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          PIPELINE_SHEET_ID: ${{ secrets.PIPELINE_SHEET_ID }}
          PIPELINE_BUDGET_USD: ${{ vars.PIPELINE_BUDGET_USD || '25' }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
          PIPELINE_EUR_USD_RATE: ${{ vars.PIPELINE_EUR_USD_RATE }}
          SITE_URL: ${{ vars.SITE_URL || 'https://frenchvineyard.com' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Hotel links the owner pasted into Hotels_Inbox: import, research (town,
      # classification, address, copy), publish those that pass, queue roundups.
      - run: npm run pipeline -- hotels:import --max 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIPELINE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_EMAIL }}
          PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          PIPELINE_SHEET_ID: ${{ secrets.PIPELINE_SHEET_ID }}
          PIPELINE_BUDGET_USD: ${{ vars.PIPELINE_BUDGET_USD || '25' }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
          PIPELINE_EUR_USD_RATE: ${{ vars.PIPELINE_EUR_USD_RATE }}
          IMAGES_CONTACT_EMAIL: ${{ vars.IMAGES_CONTACT_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://frenchvineyard.com' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # The owner's tours: follow every published tour's /go/ link and record
      # last_checked or a link_flag (with GYG_API_KEY, GetYourGuide tours are
      # refreshed from the Partner API instead).
      - run: npm run pipeline -- tours:check
        env:
          PIPELINE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_EMAIL }}
          PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          PIPELINE_SHEET_ID: ${{ secrets.PIPELINE_SHEET_ID }}
          GYG_API_KEY: ${{ secrets.GYG_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://frenchvineyard.com' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Then best_for and why_picked for published tours missing them, before
      # any page is drafted, so ranked lists and town pages can use them.
      - run: npm run pipeline -- tours:describe --max 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIPELINE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_EMAIL }}
          PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          PIPELINE_SHEET_ID: ${{ secrets.PIPELINE_SHEET_ID }}
          PIPELINE_BUDGET_USD: ${{ vars.PIPELINE_BUDGET_USD || '25' }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
          PIPELINE_EUR_USD_RATE: ${{ vars.PIPELINE_EUR_USD_RATE }}
          SITE_URL: ${{ vars.SITE_URL || 'https://frenchvineyard.com' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Refreshes only: re-research published rows past refresh_after, redraft and
      # check the ones whose facts changed, then publish those that pass. New
      # Queue rows are not researched here; run `npm run pipeline -- run` for them.
      - run: npm run pipeline -- refresh --max ${{ inputs.max || '30' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIPELINE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_EMAIL }}
          PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          PIPELINE_SHEET_ID: ${{ secrets.PIPELINE_SHEET_ID }}
          PIPELINE_BUDGET_USD: ${{ vars.PIPELINE_BUDGET_USD || '25' }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
          PIPELINE_CHECK_MODEL: ${{ vars.PIPELINE_CHECK_MODEL }}
          PIPELINE_EUR_USD_RATE: ${{ vars.PIPELINE_EUR_USD_RATE }}
          SITE_URL: ${{ vars.SITE_URL || 'https://frenchvineyard.com' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      - run: npm run pipeline -- publish --max ${{ inputs.max || '30' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIPELINE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_EMAIL }}
          PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.PIPELINE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          PIPELINE_SHEET_ID: ${{ secrets.PIPELINE_SHEET_ID }}
          PIPELINE_BUDGET_USD: ${{ vars.PIPELINE_BUDGET_USD || '25' }}
          PIPELINE_MODEL: ${{ vars.PIPELINE_MODEL }}
          PIPELINE_CHECK_MODEL: ${{ vars.PIPELINE_CHECK_MODEL }}
          PIPELINE_EUR_USD_RATE: ${{ vars.PIPELINE_EUR_USD_RATE }}
          SITE_URL: ${{ vars.SITE_URL || 'https://frenchvineyard.com' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
